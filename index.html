<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANANDHU EARNING 2026 !</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram Script -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0713;
            --card-bg: rgba(23, 14, 38, 0.75);
            --purple-accent: #9d4edd;
            --purple-glow: #7b2cbf;
            --purple-light: #e0aaff;
            --text-main: #ffffff;
            --text-sub: #b8b0ca;
            --border-purple: rgba(157, 78, 221, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 16px;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(123, 44, 191, 0.35) 0%, rgba(11, 7, 19, 0) 70%);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            animation: pulse 6s infinite alternate ease-in-out;
        }

        .ambient-glow-bottom {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, rgba(11, 7, 19, 0) 70%);
            bottom: 5%;
            right: -10%;
            z-index: 0;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.5; }
            100% { transform: translateX(-50%) scale(1.15); opacity: 0.9; }
        }

        .app-card {
            width: 100%;
            max-width: 390px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-purple);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            text-align: center;
            margin-bottom: 22px;
        }

        .badge-tag {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid var(--border-purple);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--purple-light);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .main-headline {
            font-size: 21px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
        }

        .content-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .image-wrapper {
            width: 105px;
            height: 105px;
            flex-shrink: 0;
            position: relative;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, var(--purple-accent), rgba(255, 255, 255, 0.1));
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
            background-color: #170a2c;
            display: block;
        }

        .controls-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(123, 44, 191, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-action:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn-action.unlocked {
            background: linear-gradient(135deg, #2ec4b6, #20a495);
            box-shadow: 0 6px 20px rgba(46, 196, 182, 0.4);
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--purple-light);
            box-shadow: 0 0 10px var(--purple-light);
            border-color: var(--purple-light);
        }

        .dot.completed {
            background: var(--purple-accent);
            border-color: var(--purple-accent);
            box-shadow: 0 0 6px var(--purple-accent);
        }

        .caption-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px 16px;
            text-align: center;
        }

        .caption-text {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            font-weight: 400;
        }

        .caption-text span {
            color: var(--purple-light);
            font-weight: 700;
        }

        .toast {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(123, 44, 191, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            top: 20px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-bottom"></div>

    <div id="toast" class="toast">Ad muzhuvanaayi kaanuka!</div>

    <div class="app-card" id="main-app">
        <div class="header-section">
            <div class="badge-tag">FREE ACCESS</div>
            <h1 class="main-headline">ANANDHU EARNING GROUP PORTAL </h1>
        </div>

        <div class="content-row">
            <div class="image-wrapper">
                <img src="https://i.ibb.co/LzVwQRyh/increase-money-grow-Money.jpg" alt="Thumbnail" class="main-image" id="mainImg">
            </div>

            <div class="controls-wrapper">
                <button class="btn-action" id="adBtn" onclick="handleAdClick()">
                    <i class="fa-solid fa-play" id="btnIcon"></i>
                    <span id="btnText">Watch Ads (0/5)</span>
                </button>

                <div class="progress-dots">
                    <div class="dot" id="dot-1"></div>
                    <div class="dot" id="dot-2"></div>
                    <div class="dot" id="dot-3"></div>
                    <div class="dot" id="dot-4"></div>
                    <div class="dot" id="dot-5"></div>
                </div>
            </div>
        </div>

        <div class="caption-card">
            <p class="caption-text">
               ഗ്രൂപ്പിൽ ജോയിൻ ചെയ്യാൻ മുകളിലുള്ള <span>5 ആഡ്സ്</span> കാണുക. അതിനുശേഷം ഗ്രൂപ്പിൽ ഡയറക്റ്റ് ജോയിൻ ആകുന്നതാണ്.
            </p>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg && tg.expand) {
            tg.expand();
        }

        const blockIds = [
            'int-58239', // Ad 1
            '58240', // Ad 2
            '58241', // Ad 3
            '58166', // Ad 4
            'int-58242'      // Ad 5
        ];

        let watchedCount = 0;
        const totalRequired = 5;
        const telegramGroupUrl = "https://t.me/+up_18EEy_0oyNjVl";

        function updateUI() {
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const adBtn = document.getElementById('adBtn');

            for (let i = 1; i <= totalRequired; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i <= watchedCount) {
                    dot.className = "dot completed";
                } else if (i === watchedCount + 1) {
                    dot.className = "dot active";
                } else {
                    dot.className = "dot";
                }
            }

            if (watchedCount < totalRequired) {
                btnText.innerText = `Watch Ads (${watchedCount}/${totalRequired})`;
                btnIcon.className = "fa-solid fa-play";
            } else {
                btnText.innerText = "Join Telegram Group";
                btnIcon.className = "fa-brands fa-telegram";
                adBtn.classList.add('unlocked');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function handleAdClick() {
            const adBtn = document.getElementById('adBtn');
            
            if (watchedCount >= totalRequired) {
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(telegramGroupUrl);
                } else {
                    window.location.href = telegramGroupUrl;
                }
                return;
            }

            const currentBlockId = blockIds[watchedCount];

            if (window.Adsgram) {
                adBtn.disabled = true;
                
                try {
                    const AdController = window.Adsgram.init({ blockId: currentBlockId });
                    
                    AdController.show().then((result) => {
                        adBtn.disabled = false;
                        // Ad successfully completed
                        watchedCount++;
                        updateUI();
                        if (watchedCount === totalRequired) {
                            showToast("Ellaa ad-um poorthiyaayi! Ini group-il join cheyyaam.");
                        }
                    }).catch((error) => {
                        adBtn.disabled = false;
                        // User skipped or ad failed/no fill -> DO NOT INCREMENT WATCHEDCOUNT
                        console.error("Adsgram Error or Skipped:", error);
                        showToast("Ad muzhuvanaayi kaanuka / Ad load aayilla. Meendum try cheyyaam.");
                    });
                } catch(e) {
                    adBtn.disabled = false;
                    console.error("Adsgram Init Error:", e);
                    showToast("Ad controller error. Meendum try cheyyaam.");
                }
            } else {
                // If Adsgram SDK is missing in web browser
                showToast("Adsgram SDK loading error. Telegram-il open cheyyaam.");
            }
        }

        updateUI();
    </script>
</body>
</html>
