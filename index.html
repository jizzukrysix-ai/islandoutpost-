<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0002">
<title>ANANDU EARNING HUB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root {
  --bg-color: #070002;
  --card-bg: rgba(25, 5, 8, 0.75);
  --border-color: rgba(255, 75, 95, 0.2);
  --accent-red: #ff2a4d;
  --accent-glow: rgba(255, 42, 77, 0.5);
  --text-main: #ffffff;
  --text-muted: #b0a4a7;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  font-family: var(--font);
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

#app {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #1f030a 0%, #070002 70%);
}

.main-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: fadeIn 0.6s ease-out;
}

/* Top Welcome Badge */
.welcome-badge {
  background: rgba(255, 42, 77, 0.08);
  border: 1px solid rgba(255, 42, 77, 0.3);
  color: #ff99ab;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 6px 20px;
  border-radius: 20px;
  text-transform: uppercase;
  box-shadow: 0 0 15px rgba(255, 42, 77, 0.15);
}

/* Glowing Circle Image */
.circle-img-container {
  position: relative;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, #ff2a4d, #700015);
  box-shadow: 0 0 30px var(--accent-glow), inset 0 0 15px rgba(255, 42, 77, 0.5);
  animation: pulseGlow 3s infinite alternate;
  margin: 4px 0;
}

.circle-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #110003;
}

/* Title Header */
.hub-title {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  margin: 0;
  text-align: center;
  background: linear-gradient(180deg, #ffffff 30%, #ff99ab 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sub-text {
  font-size: 13px;
  color: var(--text-muted);
  text-align: center;
  margin: -8px 0 4px 0;
}

/* Divider Line */
.divider {
  width: 60px;
  height: 3px;
  background: var(--accent-red);
  border-radius: 2px;
  box-shadow: 0 0 10px var(--accent-red);
  margin: 4px 0 12px 0;
}

/* Info Box matching screenshot */
.info-card {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.info-card h4 {
  margin: 0 0 8px 0;
  font-size: 15px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.info-card p {
  margin: 0;
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Action Button (Watch Ads / Join Telegram) */
.action-btn {
  width: 100%;
  background: linear-gradient(135deg, #ff2a4d, #b30024);
  border: 1px solid rgba(255, 153, 171, 0.4);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  padding: 16px 20px;
  border-radius: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 8px 25px var(--accent-glow);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.action-btn:active {
  transform: scale(0.97);
}

.action-btn.success {
  background: linear-gradient(135deg, #059669, #10b981);
  box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
}

.footer-note {
  font-size: 11px;
  color: #7a6d71;
  text-align: center;
  margin-top: 4px;
}

/* Toast Notification */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #140206;
  border: 1px solid rgba(255, 42, 77, 0.5);
  color: #fff;
  padding: 10px 20px;
  border-radius: 25px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 99;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}
#toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 20px rgba(255, 42, 77, 0.4); }
  100% { box-shadow: 0 0 35px rgba(255, 42, 77, 0.8); }
}
</style>
</head>
<body>

<div id="app">
  <div class="main-container">
    <div class="welcome-badge">Welcome to our community</div>

    <!-- Circle Image with Glowing Ring -->
    <div class="circle-img-container">
      <img src="https://i.ibb.co/LzVwQRyh/increase-money-grow-Money.jpg" alt="Vicky Hub" class="circle-img">
    </div>

    <h1 class="hub-title">EARNING TUTORIAL HUB 📈</h1>
    <div class="sub-text">Join our community for updates and insights.</div>
    <div class="divider"></div>

    <!-- Info Box -->
    <div class="info-card">
      <h4>ANANDHU EARNING 💸</h4>
      <p>Join our Telegram community to stay connected and receive the latest updates.</p>
    </div>

    <!-- Watch Ads / Join Button -->
    <button class="action-btn" id="actionBtn" onclick="handleMainAction()">
      <span>▶</span> <span id="btnText">Watch Ads (0/5)</span>
    </button>

    <div class="footer-note" id="footerNote">ഗ്രൂപ്പിൽ ജോയിൻ ചെയ്യാൻ മുകളിലുള്ള ADS കാണുക. അതിനുശേഷം ഗ്രൂപ്പിൽ ഡയറക്ട് ജോയിൻ ആകുന്നതാണ്</div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  // 5 വ്യത്യസ്ത ആഡ് ബ്ലോക്ക് ഐഡികൾ
  var ADSGRAM_BLOCK_IDS = [
    'int-58239', // Ad 1
    '58240',     // Ad 2
    '58241',     // Ad 3
    '58166',     // Ad 4
    'int-58242'  // Ad 5
  ];

  var currentAdCount = 0;
  var maxAds = 5;
  var isUnlocked = false;

  var TG = window.Telegram && window.Telegram.WebApp;
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      TG.setHeaderColor && TG.setHeaderColor("#070002");
      TG.setBackgroundColor && TG.setBackgroundColor("#070002");
    } catch(e){}
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("on");
    setTimeout(function(){ t.classList.remove("on"); }, 2500);
  }

  function updateUI() {
    var btnText = document.getElementById("btnText");
    var actionBtn = document.getElementById("actionBtn");
    var footerNote = document.getElementById("footerNote");

    if (currentAdCount < maxAds) {
      btnText.textContent = "Watch Ads (" + currentAdCount + "/" + maxAds + ")";
    } else {
      isUnlocked = true;
      actionBtn.innerHTML = "<span>✈️</span> <span>JOIN TELEGRAM COMMUNITY</span>";
      actionBtn.classList.add("success");
      footerNote.textContent = "Tap the button above to visit our Telegram community.";
    }
  }

  window.handleMainAction = function() {
    if (isUnlocked) {
      // എല്ലാ ആഡ്സും കണ്ടുകഴിഞ്ഞാൽ ടെലഗ്രാം ലിങ്കിലേക്ക് പോകും
      var groupLink = "https://t.me/+up_18EEy_0oyNjVl"; // നിങ്ങളുടെ ടെലിഗ്രാം ലിങ്ക് ഇവിടെ നൽകുക
      toast("ടേലഗ്രാം ഗ്രൂപ്പിലേക്ക് സ്വാഗതം!");
      setTimeout(function(){
        if (TG && TG.openTelegramLink) {
          TG.openTelegramLink(groupLink);
        } else {
          window.open(groupLink, "_blank");
        }
      }, 800);
      return;
    }

    var currentBlockId = ADSGRAM_BLOCK_IDS[currentAdCount];

    if (!window.Adsgram) {
      // ടെസ്റ്റിംഗിനായി ആഡ്സ്ഗ്രാം SDK ഇല്ലാത്തപ്പോൾ ഓട്ടോമാറ്റിക് കൗണ്ട് കൂടാൻ
      currentAdCount++;
      updateUI();
      toast("Ad " + currentAdCount + " watched successfully!");
      return;
    }

    try {
      var AdController = window.Adsgram.init({ blockId: currentBlockId });
      AdController.show().then(function(result) {
        if (result && result.done) {
          currentAdCount++;
          updateUI();
          toast("Ad " + currentAdCount + " വിജയകരമായി കണ്ടു തീർത്തു!");
        } else {
          toast("ആഡ് മുഴുവനായി കണ്ടാൽ മാത്രമേ അടുത്തതിലേക്ക് പോവുകയുള്ളൂ.");
        }
      }).catch(function(err) {
        toast("ആഡ് ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു. വീണ്ടും ശ്രമിക്കുക.");
      });
    } catch(e) {
      toast("ആഡ് സിസ്റ്റം എറർ.");
    }
  };

  updateUI();
})();
</script>
</body>
</html>
