<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0814">
<title>ANANDHU EARNING 2027</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root {
  --bg-color: #0b0711;
  --card-bg: rgba(26, 17, 38, 0.85);
  --border-color: rgba(168, 85, 247, 0.35);
  --accent-purple: #9333ea;
  --accent-glow: rgba(147, 51, 234, 0.6);
  --text-main: #ffffff;
  --text-muted: #c0b6cf;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  font-family: var(--font);
  background: var(--bg-color);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#app {
  width: 100%;
  max-width: 420px;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.main-card {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 26px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

.main-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(147, 51, 234, 0.1) 0%, transparent 60%);
  pointer-events: none;
  animation: rotateGlow 10s linear infinite;
}

.vip-badge {
  background: linear-gradient(135deg, rgba(147, 51, 234, 0.2), rgba(168, 85, 247, 0.4));
  border: 1px solid rgba(168, 85, 247, 0.6);
  color: #e9d5ff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 6px 18px;
  border-radius: 20px;
  text-transform: uppercase;
  margin-bottom: 14px;
  box-shadow: 0 0 15px rgba(147, 51, 234, 0.3);
  position: relative;
  z-index: 1;
}

.sub-heading {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin: 0 0 24px 0;
  text-align: center;
  background: linear-gradient(180deg, #ffffff 0%, #d8b4fe 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  position: relative;
  z-index: 1;
}

.content-row {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin-bottom: 24px;
  position: relative;
  z-index: 1;
}

/* Left Square Box with Image */
.left-image-box {
  width: 100px;
  height: 100px;
  background: rgba(15, 10, 24, 0.9);
  border: 1.5px solid rgba(168, 85, 247, 0.4);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 2px 6px rgba(0,0,0,0.6);
  flex-shrink: 0;
  position: relative;
  transition: transform 0.3s ease;
}

.left-image-box:hover {
  transform: scale(1.03);
}

.left-image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.right-action-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.watch-btn {
  width: 100%;
  background: linear-gradient(135deg, #9333ea, #6b21a8);
  border: 1px solid rgba(216, 180, 254, 0.4);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  padding: 14px 12px;
  border-radius: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 25px var(--accent-glow);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.watch-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: 0.5s;
}

.watch-btn:hover::after {
  left: 100%;
}

.watch-btn:active {
  transform: scale(0.96);
}

.watch-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  filter: grayscale(0.5);
  box-shadow: none;
}

.dots-container {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.dot.active {
  background: #c084fc;
  width: 20px;
  border-radius: 6px;
  box-shadow: 0 0 10px #c084fc;
}

.caption-box {
  width: 100%;
  background: rgba(15, 10, 24, 0.7);
  border: 1px solid rgba(168, 85, 247, 0.25);
  border-radius: 16px;
  padding: 14px 16px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-muted);
  position: relative;
  z-index: 1;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
}

.caption-box span {
  color: #e9d5ff;
  font-weight: 600;
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(24, 17, 36, 0.95);
  border: 1px solid rgba(168, 85, 247, 0.6);
  color: #fff;
  padding: 12px 22px;
  border-radius: 30px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 99;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
#toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@keyframes cardEntrance {
  from { opacity: 0; transform: scale(0.92) translateY(15px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes rotateGlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div id="app">
  <div class="main-card">
    <div class="vip-badge">FREE ACCESS</div>
    <h1 class="sub-heading">ANANDHU EARNING GUIDE PORTAL</h1>

    <div class="content-row">
      <!-- Left Square Box with Image -->
      <div class="left-image-box">
        <!-- നിങ്ങളുടെ ഇമേജ് ലിങ്ക് ഇവിടെ നൽകുക (Src മാറ്റാവുന്നതാണ്) -->
        <img src="https://i.ibb.co/LzVwQRyh/increase-money-grow-Money.jpg" alt="Sensi Image">
      </div>

      <div class="right-action-area">
        <button class="watch-btn" id="watchBtn" onclick="handleWatchAd()">
          <span>▶</span> <span id="btnText">Watch Ads (0/5)</span>
        </button>
        
        <div class="dots-container" id="dotsContainer">
          <div class="dot" id="dot-1"></div>
          <div class="dot" id="dot-2"></div>
          <div class="dot" id="dot-3"></div>
          <div class="dot" id="dot-4"></div>
          <div class="dot" id="dot-5"></div>
        </div>
      </div>
    </div>

    <div class="caption-box">
      ഗ്രൂപ്പിൽ ജോയിൻ ചെയ്യാൻ മുകളിലുള്ള <span>5 ആഡ്സ്</span> കാണുക. അതിനുശേഷം ഗ്രൂപ്പിൽ ഡയറക്ട് ജോയിൻ ആകുന്നതാണ്.
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  // 5 വ്യത്യസ്ത ആഡ് ബ്ലോക്ക് ഐഡികൾ (ഒരോ ആഡിനും ഓരോ ബ്ലോക്ക് വീതം)
  var ADSGRAM_BLOCK_IDS = [
    'int-58239', // Ad 1
    '58240',     // Ad 2
    '58241',     // Ad 3
    '58166',     // Ad 4
    'int-58242'  // Ad 5
  ];

  var currentAdCount = 0;
  var maxAds = 5;

  var TG = window.Telegram && window.Telegram.WebApp;
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      TG.setHeaderColor && TG.setHeaderColor("#0b0711");
      TG.setBackgroundColor && TG.setBackgroundColor("#0b0711");
    } catch(e){}
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("on");
    setTimeout(function(){ t.classList.remove("on"); }, 2500);
  }

  function updateUI() {
    document.getElementById("btnText").textContent = "Watch Ads (" + currentAdCount + "/" + maxAds + ")";
    
    for (var i = 1; i <= maxAds; i++) {
      var dot = document.getElementById("dot-" + i);
      if (i <= currentAdCount) {
        dot.classList.add("active");
      } else {
        dot.classList.remove("active");
      }
    }

    if (currentAdCount >= maxAds) {
      var btn = document.getElementById("watchBtn");
      btn.innerHTML = "<span>✓</span> <span>Verified! Joining Group...</span>";
      btn.style.background = "linear-gradient(135deg, #059669, #10b981)";
      
      setTimeout(function() {
        toast("എല്ലാ ആഡ്സും പൂർത്തിയായി! ടെലഗ്രാം ഗ്രൂപ്പിലേക്ക് തിരിച്ചുവിടുന്നു...");
        setTimeout(function(){
          var groupLink = "https://t.me/+up_18EEy_0oyNjVl";
          if (TG && TG.openTelegramLink) {
            TG.openTelegramLink(groupLink);
          } else {
            window.open(groupLink, "_blank");
          }
        }, 1200);
      }, 500);
    }
  }

  window.handleWatchAd = function() {
    if (currentAdCount >= maxAds) return;

    var currentBlockId = ADSGRAM_BLOCK_IDS[currentAdCount];

    if (!window.Adsgram) {
      currentAdCount++;
      updateUI();
      toast("Ad " + currentAdCount + " watched successfully!");
      return;
    }

    try {
      var AdController = window.Adsgram.init({ blockId: currentBlockId });
      AdController.show().then(function(result) {
        if (result && result.done) {
          currentAdCount++;
          updateUI();
          toast("Ad " + currentAdCount + " വിജയകരമായി കണ്ടു തീർത്തു!");
        } else {
          toast("ആഡ് മുഴുവനായി കണ്ടാൽ മാത്രമേ അടുത്തതിലേക്ക് പോവുകയുള്ളൂ.");
        }
      }).catch(function(err) {
        toast("ആഡ് ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു. വീണ്ടും ശ്രമിക്കുക.");
      });
    } catch(e) {
      toast("ആഡ് സിസ്റ്റം എറർ.");
    }
  };

  updateUI();
})();
</script>
</body>
</html>
